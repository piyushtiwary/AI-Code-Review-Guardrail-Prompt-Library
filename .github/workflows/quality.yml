name: Project quality gate
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: Guardrail checkout
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: Guardrail checkout
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,model]"
      - name: Run the test suite and enforce coverage
        run: python -m pytest
      - name: Build and exercise the installed wheel
        run: python scripts/smoke_wheel.py
