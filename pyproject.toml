[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-review-guardrail"
version = "0.1.0"
description = "A CLI for reviewing Python changes and working with versioned prompts."
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "rich>=13", "typer>=0.12", "unidiff>=1.0.1,<2"]

[project.scripts]
guardrail = "guardrail.cli:app"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "syrupy", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]
