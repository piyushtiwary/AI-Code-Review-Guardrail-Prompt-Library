[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-review-guardrail"
version = "0.1.0"
description = "A CLI for reviewing Python changes and working with versioned prompts."
requires-python = ">=3.12"
dependencies = [
    "bandit>=1.8,<2",
    "Jinja2>=3.1,<4",
    "pydantic>=2,<3",
    "PyGithub>=2.5,<3",
    "PyYAML>=6,<7",
    "rich>=13",
    "ruff>=0.9,<1",
    "typer>=0.12",
    "unidiff>=1.0.1,<2",
]

[project.scripts]
guardrail = "guardrail.cli:app"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "syrupy"]
model = ["openai>=1.68,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
guardrail = ["templates/*.jinja2", "prompt_library/*.yaml", "prompt_library/fixtures/*.yaml"]
